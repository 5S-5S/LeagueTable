name = "leaguetable-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "leaguetable"
database_id = "7069d435-b2d1-4b49-9510-8be2cf8119d9"

[[kv_namespaces]]
binding = "CACHE"
id = "b2fa8b93e59540749923768aaf1fc08d"

# Live results (recordFinishedMatches in src/index.js). Every 2 minutes; a
# run with nothing due is one small D1 read and no API call.
# Needs the secret: npx wrangler secret put FOOTBALL_DATA_API_KEY
[triggers]
crons = ["*/2 * * * *"]
