    <main class="search-page">
        <div class="search-card">

    <script src="search.js"></script>
    <script>
        // Example questions for each dropdown choice, one or two per kind of
        // question (head to head, tables, records, titles, streaks, last
        // time, biggest wins, eras) - every one opens an answer
        const SEARCH_EXAMPLES = {
            'domestic': [
                "Barcelona vs Real Madrid at home",
                "Arsenal vs Chelsea since 2010",
                "Serie A 2005-06",
                "Bundesliga table since 2010",
                "Juventus titles",
                "Bayern longest unbeaten run",
                "Last time Liverpool beat Manchester United away",
                "PSG biggest wins",
                "Arsenal top 4",
                "First time champions Bundesliga"
            ],
            'premier-league': [
                "Arsenal vs Chelsea",
                "Premier League 2003-04",
                "Arsenal longest unbeaten run",
                "Manchester United Premier League titles",
                "Arsenal vs the Big 6 at home",
                "Last time Liverpool beat Everton away",
                "Tottenham biggest defeats",
                "Premier League champions",
                "Newcastle highest scoring draws",
                "Longest winning streaks"
            ],
            'la-liga': [
                "Barcelona vs Real Madrid",
                "La Liga 2010-11",
                "Real Madrid titles",
                "Last time Barcelona beat Real Madrid away",
                "Atletico Madrid biggest wins",
                "Barcelona longest unbeaten run",
                "Athletic Club seasons",
                "La Liga home table 2010-11",
                "Sevilla top 4",
                "First time champions La Liga"
            ],
            'serie-a': [
                "Juventus vs Inter",
                "Serie A 2005-06",
                "Juventus titles",
                "AC Milan longest unbeaten run",
                "Napoli titles",
                "Last time Roma beat Lazio",
                "Inter vs AC Milan since 2010",
                "Serie A champions",
                "Atalanta top 4",
                "Juventus biggest wins"
            ],
            'bundesliga': [
                "Bayern vs Dortmund",
                "Bundesliga 2023-24",
                "Bayern titles including historic",
                "Dortmund longest winning streak",
                "Last time Schalke beat Dortmund",
                "First time champions Bundesliga",
                "Bayer Leverkusen 2023-24",
                "Bundesliga table since 2010",
                "Werder Bremen titles",
                "Bayern biggest wins"
            ],
            'ligue-1': [
                "PSG vs Marseille",
                "Ligue 1 1992-93",
                "Saint-Etienne titles",
                "PSG longest unbeaten run",
                "Last time Marseille beat PSG away",
                "Monaco biggest wins",
                "Lyon titles",
                "Ligue 1 champions",
                "Lille 2010-11",
                "PSG vs Lyon since 2012"
            ],
            'champions-league': [
                "Real Madrid vs Bayern",
                "Real Madrid titles",
                "Champions League 2004-05",
                "Liverpool lost in the final",
                "Arsenal vs Spain",
                "Real Madrid biggest aggregate wins",
                "Bayern longest winning streak in the knockouts",
                "Last time Real Madrid lost to English clubs",
                "Champions League winners",
                "Ajax European Cup titles"
            ]
        };

        function renderSearchExamples(search) {
            const examples = SEARCH_EXAMPLES[search.scope()] || SEARCH_EXAMPLES.domestic;
            const container = document.getElementById('searchExamples');
            container.innerHTML = '<span class="search-examples-label">Try:</span>' +
                examples.map(text => `<button type="button" class="search-example">${text}</button>`).join('');
            container.querySelectorAll('.search-example').forEach(button => {
                button.addEventListener('click', () => search.setQuery(button.textContent));
            });
        }

        // Search bar (search.js); the examples follow the dropdown and fill
        // in a search when clicked
        function initSearch() {
            const search = LeagueSearch.mount(document.getElementById('searchMount'), {
                autofocus: true,
                onScopeChange: () => renderSearchExamples(search)
            });
            renderSearchExamples(search);
        }

        // Hamburger Menu Functionality
        function initHamburgerMenu() {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            const closeBtn = document.getElementById('closeMenuBtn');
            
            // Toggle menu function
            function toggleMenu() {
                const isOpen = sideMenu.classList.contains('open');
                
                if (isOpen) {
                    // Close menu
                    sideMenu.classList.remove('open');
                    menuOverlay.classList.remove('active');
                    hamburgerBtn.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    // Open menu
                    sideMenu.classList.add('open');
                    menuOverlay.classList.add('active');
                    hamburgerBtn.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }
            
            // Event listeners
            hamburgerBtn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', toggleMenu);
            
            // Prevent menu from closing when clicking inside the menu
            sideMenu.addEventListener('click', (e) => {
                e.stopPropagation();
            });
            
            // Close menu with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sideMenu.classList.contains('open')) {
                    toggleMenu();
                }
            });
        }

        // Dark Mode Functionality
        function initDarkMode() {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const body = document.body;
            
            // Check for saved dark mode preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.setAttribute('data-theme', 'dark');
                darkModeToggle.checked = true;
            }
            
            // Add event listener for toggle
            darkModeToggle.addEventListener('change', function() {
                if (this.checked) {
                    body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            initHamburgerMenu();
            initDarkMode();
            initSearch();
        });
    </script>
</body>
</html>
