<body>
    <!-- Hamburger Menu Button -->

    <!-- Dark Mode Toggle (Fixed Position) -->

        <input type="checkbox" id="darkModeToggle" class="toggle-checkbox">

        </label>
    </div>

    <!-- Sidebar Overlay -->
    <div id="menuOverlay" class="menu-overlay hidden"></div>

    <!-- Sidebar Menu -->
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h2 class="text-xl font-bold text-gray-800">Navigation</h2>
            <button id="closeMenuBtn" class="close-btn">&times;</button>

        <nav class="menu-nav">
            <!-- Home Section -->
            <div class="menu-section">

            </div>
            
            <!-- Football Section -->
            <div class="menu-section">
                <h3 class="menu-section-title">Football</h3>
                <a href="DomesticEurope.html" class="menu-item" data-page="domestic">

                    <span>Domestic Football - Top 5 Leagues</span>

                <a href="ContinentalEurope.html" class="menu-item" data-page="continental">

            <!-- Other Sports Section -->

            <!-- Support Section -->

    <main class="search-page">
        <div class="search-card">
            <h1 class="hero-title">League Table Statistics</h1>
            <section id="upcomingStrip" class="um-strip" aria-label="Upcoming matches" hidden></section>
            <div id="searchMount"></div>
            <div id="searchExamples" class="search-examples"></div>
        </div>
        <!-- Matches played on today's date in earlier years (onthisday.js); a .search-card so it hides with it while a match is open -->
        <section id="onThisDay" class="search-card ss-card otd-card" aria-label="On this day" hidden></section>
        <!-- Streaks snapped in the last year (snapped.js); a .search-card so it hides with it while a match is open -->
        <section id="snappedStreaks" class="search-card ss-card" aria-label="Streaks snapped" hidden></section>
        <!-- One club's overview (team.js, ?team=), under the search bar in place of the strip and streaks card -->
        <div id="teamView" class="um-view to-view" hidden></div>
        <!-- One upcoming match, in the search card's place (upcoming.js) -->
        <div id="matchView" class="um-view" hidden></div>
    </main>

    <script src="search.js"></script>
    <script src="team-registry.js"></script>
    <script src="upcoming.js"></script>
    <script src="snapped.js"></script>
    <script src="combobox.js"></script>
    <script src="favourite-team.js"></script>
    <script src="favourite-picker.js"></script>
    <script src="onthisday.js"></script>
    <script src="standings-adjustments.js"></script>
    <script src="season-rules-domestic.js"></script>
    <script src="season-rules-continental.js"></script>
    <script src="team.js"></script>
    <script>
        function renderSearchExamples(search) {
            // The same example questions the empty search bar suggests
            const examples = LeagueSearch.examples(search.scope());
            const container = document.getElementById('searchExamples');
            container.innerHTML = '<span class="search-examples-label">Try:</span>' +
                examples.map(text => `<button type="button" class="search-example">${text}</button>`).join('');
            container.querySelectorAll('.search-example').forEach(button => {
                button.addEventListener('click', () => search.setQuery(button.textContent));
            });
        }

        // Search bar (search.js); the examples follow the dropdown and fill
        // in a search when clicked. On a team overview (?team=) it starts
        // with the club and its competition, without focus, so its results
        // don't open over the overview.
        function initSearch() {
            const params = new URLSearchParams(window.location.search);
            const team = params.get('team');
            const search = LeagueSearch.mount(document.getElementById('searchMount'), {
                autofocus: !team,
                query: team || '',
                scope: team ? params.get('lg') || '' : '',
                onScopeChange: () => renderSearchExamples(search)
            });
            renderSearchExamples(search);
        }

        // Hamburger Menu Functionality
        function initHamburgerMenu() {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            const closeBtn = document.getElementById('closeMenuBtn');
            
            // Toggle menu function
            function toggleMenu() {
                const isOpen = sideMenu.classList.contains('open');
                
                if (isOpen) {
                    // Close menu
                    sideMenu.classList.remove('open');
                    menuOverlay.classList.remove('active');
                    hamburgerBtn.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    // Open menu
                    sideMenu.classList.add('open');
                    menuOverlay.classList.add('active');
                    hamburgerBtn.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }
            
            // Event listeners
            hamburgerBtn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', toggleMenu);
            
            // Prevent menu from closing when clicking inside the menu
            sideMenu.addEventListener('click', (e) => {
                e.stopPropagation();
            });
            
            // Close menu with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sideMenu.classList.contains('open')) {
                    toggleMenu();
                }
            });
        }

        // Dark Mode Functionality
        function initDarkMode() {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const body = document.body;
            
            // Check for saved dark mode preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.setAttribute('data-theme', 'dark');
                darkModeToggle.checked = true;
            }
            
            // Add event listener for toggle
            darkModeToggle.addEventListener('change', function() {
                if (this.checked) {
                    body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            initHamburgerMenu();
            initDarkMode();
            initSearch();
            FavouritePicker.mount();
            UpcomingMatches.mount({
                strip: document.getElementById('upcomingStrip'),
                view: document.getElementById('matchView')
            });
            OnThisDay.mount(document.getElementById('onThisDay'));
            SnappedStreaks.mount(document.getElementById('snappedStreaks'));
            TeamOverview.mount(document.getElementById('teamView'));
        });
    </script>
</body>
</html>
