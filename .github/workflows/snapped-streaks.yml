name: Update snapped streaks

on:
  # After each daily D1 sync (new results from the gists)
  workflow_run:
    workflows: ["Sync D1 database"]
    types: [completed]
  # After the Worker records live results (requestSnappedStreaksUpdate in
  # backend/worker/src/index.js)
  repository_dispatch:
    types: [results-recorded]
  workflow_dispatch:

# A later run supersedes one still going - it reads newer results
concurrency:
  group: snapped-streaks
  cancel-in-progress: true

jobs:
  snapped-streaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The Worker reads its cache version at most once a minute per
      # isolate, so an answer cached before the new results can be served
      # for up to a minute after they land
      - name: Wait for the API cache to turn over
        if: github.event_name != 'workflow_dispatch'
        run: sleep 70

      - name: Rebuild the snapped streaks list
        working-directory: backend/migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node snapped-streaks.mjs

      # The home page keeps showing the last list it got, growing staler.
      # One open issue collects consecutive failures (same as sync-d1.yml).
      - name: File or update a GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- snapped-streaks-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'sync-failure',
            });
            const existing = issues.find(i => i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `Failed again on ${today}: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'snapped-streaks workflow failed - the home page list is not updating',
                labels: ['sync-failure'],
                body: `${marker}\nThe snapped streaks update failed on ${today}: ${runUrl}\n\n` +
                  `The home page keeps showing the last list that was written, so nothing breaks, ` +
                  `but new snapped streaks won't appear until a run succeeds. Check the run log.\n\n` +
                  `This issue stays open and collects a comment per failure until someone closes it.`,
              });
            }
