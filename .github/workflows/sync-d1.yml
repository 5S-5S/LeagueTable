name: Sync D1 database

on:
  schedule:
    # 06:30 UTC daily — after both score-update workflows (06:00/06:15 UTC)
    # have already refreshed the gists, so this picks up same-day results
    # instead of trailing a day behind.
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  sync-d1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: backend/migration
        run: npm install

      - name: Sync new matches into D1
        working-directory: backend/migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node sync.mjs

      # This job failing means D1 silently stops receiving new matches -
      # the 2026-09-20/21 quota-exhaustion incident (see
      # backend/README.md's "Data integrity") went unnoticed for two full
      # days precisely because nothing alerted anyone. Reuses one open
      # issue across consecutive failures instead of creating a new one
      # each day, so a multi-day outage doesn't spam the issue tracker.
      - name: File or update a GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sync-d1-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
            });
            const existing = issues.find(i => i.body && i.body.includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again on ${today}: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'sync-d1 workflow failed - D1 is not receiving new matches',
                labels: ['sync-failure'],
                body: `${marker}\nThe daily D1 sync failed on ${today}: ${runUrl}\n\n` +
                  `D1 will keep serving stale data (no error, no visible sign to users) until this ` +
                  `is fixed and a sync succeeds. Check the run log first - the most common cause so ` +
                  `far has been D1's free-tier daily quota (read or write) being exhausted; see ` +
                  `backend/README.md's "Data integrity" section.\n\n` +
                  `This issue stays open and collects a comment per failed day until someone closes ` +
                  `it - closing it is the "I've seen this" signal, not something automated.`,
              });
            }
