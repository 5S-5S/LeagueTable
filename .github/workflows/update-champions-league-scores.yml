name: Update Champions League scores

on:
  schedule:
    # 06:15 UTC daily — staggered a few minutes after the domestic scores job
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (don't write to any gist)"
        type: boolean
        required: false
        default: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '7' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/update_champions_league_scores.py $ARGS
